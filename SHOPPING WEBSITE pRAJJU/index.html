
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShopZone - Online Shopping</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navbar -->
    <header>
        <nav class="navbar">

            <h2 class="logo">Shop<span>Zone</span></h2>

            <div class="search-box">
                <input type="text" id="searchInput"
                placeholder="Search products...">

                <button onclick="searchProducts()">Search</button>
            </div>

            <div class="cart">
                🛒 Cart
                <span id="cartCount">0</span>
            </div>

        </nav>
    </header>


    <!-- Hero Section -->
    <section class="hero">

        <div class="hero-content">

            <h1>Discover Your Style</h1>

            <p>Shop the latest trends at amazing prices.</p>

            <button onclick="scrollToProducts()">
                Shop Now
            </button>

        </div>

    </section>


    <!-- Products Section -->
    <section class="products-section" id="products">

        <h1>Our Products</h1>

        <p class="subtitle">
            Explore our latest collection
        </p>

        <div class="product-container" id="productContainer">

            <!-- Products loaded using JavaScript -->

        </div>

    </section>


    <!-- Cart Section -->
    <section class="cart-section">

        <h2>Shopping Cart</h2>

        <div id="cartItems">
            Your cart is empty.
        </div>

        <h3>Total: ₹<span id="totalPrice">0</span></h3>

        <button class="clear-btn" onclick="clearCart()">
            Clear Cart
        </button>

    </section>


    <!-- Footer -->
    <footer>

        <h2>ShopZone</h2>

        <p>Your One-Stop Online Shopping Destination</p>

        <p>© 2026 ShopZone. All Rights Reserved.</p>

    </footer>


    <script src="script.js"></script>

</body>
</html>
